<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeUnity Metaverse Gallery - 3D 전시장</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background: #000;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
        }

        #info {
            position: fixed;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 20px;
            border-radius: 10px;
            font-size: 14px;
            z-index: 100;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        #info h3 {
            margin-bottom: 10px;
            color: #4CAF50;
        }

        #info p {
            margin: 5px 0;
            line-height: 1.5;
        }

        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            z-index: 200;
            text-align: center;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #4CAF50;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 25px;
            border-radius: 10px;
            color: white;
            z-index: 100;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <p>갤러리 로딩 중...</p>
    </div>

    <div id="info">
        <h3>🎨 LifeUnity Metaverse</h3>
        <p><strong>조작법:</strong></p>
        <p>🖱️ 마우스 드래그: 시점 회전</p>
        <p>⌨️ W/A/S/D: 이동</p>
        <p>⌨️ Shift: 달리기</p>
        <p>⌨️ Space: 위로</p>
        <p>⌨️ C: 아래로</p>
        <p style="margin-top: 10px; color: #4CAF50;">✨ 실시간 3D 렌더링</p>
    </div>

    <div id="controls">
        <p>클릭하고 마우스를 움직여 주변을 둘러보세요!</p>
    </div>

    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Three.js 설정
        let scene, camera, renderer, controls;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let moveUp = false, moveDown = false, sprint = false;
        let velocity = new THREE.Vector3();
        let direction = new THREE.Vector3();
        let rotation = new THREE.Euler(0, 0, 0, 'YXZ');
        let isPointerLocked = false;

        // 초기화
        function init() {
            // 씬 생성
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf5f5f5);
            scene.fog = new THREE.Fog(0xf5f5f5, 1, 100);

            // 카메라
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.6, 5);

            // 렌더러
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // 조명
            setupLights();

            // 갤러리 환경
            createGallery();

            // 작품 배치
            createArtworks();

            // 이벤트 리스너
            setupControls();

            // 로딩 완료
            document.getElementById('loading').classList.add('hidden');

            // 애니메이션 시작
            animate();
        }

        // 조명 설정
        function setupLights() {
            // 환경광
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            // 메인 디렉셔널 라이트 (태양광)
            const directionalLight = new THREE.DirectionalLight(0xfff4e6, 0.8);
            directionalLight.position.set(5, 10, 7);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            directionalLight.shadow.camera.near = 0.5;
            directionalLight.shadow.camera.far = 50;
            scene.add(directionalLight);

            // 스포트라이트 (작품 강조용)
            const spotLight1 = new THREE.SpotLight(0xffffff, 1.5);
            spotLight1.position.set(-5, 3, 0);
            spotLight1.angle = Math.PI / 6;
            spotLight1.penumbra = 0.3;
            spotLight1.castShadow = true;
            scene.add(spotLight1);

            const spotLight2 = new THREE.SpotLight(0xffffff, 1.5);
            spotLight2.position.set(5, 3, 0);
            spotLight2.angle = Math.PI / 6;
            spotLight2.penumbra = 0.3;
            scene.add(spotLight2);
        }

        // 갤러리 생성
        function createGallery() {
            // 바닥
            const floorGeometry = new THREE.PlaneGeometry(30, 30);
            const floorMaterial = new THREE.MeshStandardMaterial({
                color: 0xe0e0e0,
                roughness: 0.3,
                metalness: 0.1
            });
            const floor = new THREE.Mesh(floorGeometry, floorMaterial);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // 벽 (4개)
            const wallMaterial = new THREE.MeshStandardMaterial({
                color: 0xffffff,
                roughness: 0.8,
                metalness: 0
            });

            // 북쪽 벽
            const wallNorth = new THREE.Mesh(
                new THREE.BoxGeometry(30, 5, 0.3),
                wallMaterial
            );
            wallNorth.position.set(0, 2.5, -15);
            wallNorth.castShadow = true;
            wallNorth.receiveShadow = true;
            scene.add(wallNorth);

            // 남쪽 벽
            const wallSouth = new THREE.Mesh(
                new THREE.BoxGeometry(30, 5, 0.3),
                wallMaterial
            );
            wallSouth.position.set(0, 2.5, 15);
            wallSouth.castShadow = true;
            scene.add(wallSouth);

            // 동쪽 벽
            const wallEast = new THREE.Mesh(
                new THREE.BoxGeometry(0.3, 5, 30),
                wallMaterial
            );
            wallEast.position.set(15, 2.5, 0);
            wallEast.castShadow = true;
            scene.add(wallEast);

            // 서쪽 벽
            const wallWest = new THREE.Mesh(
                new THREE.BoxGeometry(0.3, 5, 30),
                wallMaterial
            );
            wallWest.position.set(-15, 2.5, 0);
            wallWest.castShadow = true;
            scene.add(wallWest);

            // 천장
            const ceiling = new THREE.Mesh(
                new THREE.PlaneGeometry(30, 30),
                new THREE.MeshStandardMaterial({ color: 0xfafafa, roughness: 0.9 })
            );
            ceiling.rotation.x = Math.PI / 2;
            ceiling.position.y = 5;
            ceiling.receiveShadow = true;
            scene.add(ceiling);
        }

        // 작품 배치
        function createArtworks() {
            const artworks = [
                { x: 0, z: -14.5, title: "Abstract Art 1", color: 0xff6b6b },
                { x: -8, z: -14.5, title: "Landscape", color: 0x4ecdc4 },
                { x: 8, z: -14.5, title: "Portrait", color: 0xffe66d },
                { x: -14.5, z: -5, title: "Modern Art", color: 0x95e1d3, rotation: Math.PI / 2 },
                { x: -14.5, z: 5, title: "Digital Art", color: 0xf38181, rotation: Math.PI / 2 },
                { x: 14.5, z: -5, title: "Photography", color: 0xaa96da, rotation: -Math.PI / 2 },
                { x: 14.5, z: 5, title: "Sculpture", color: 0xfcbad3, rotation: -Math.PI / 2 }
            ];

            artworks.forEach(art => {
                createArtworkFrame(art);
            });
        }

        function createArtworkFrame(art) {
            // 프레임 그룹
            const frameGroup = new THREE.Group();

            // 액자 (프레임)
            const frameMaterial = new THREE.MeshStandardMaterial({
                color: 0x2c3e50,
                roughness: 0.3,
                metalness: 0.7
            });

            const frameThickness = 0.1;
            const frameWidth = 2;
            const frameHeight = 1.5;

            // 프레임 테두리 (4개)
            const frameTop = new THREE.Mesh(
                new THREE.BoxGeometry(frameWidth + 0.2, frameThickness, frameThickness),
                frameMaterial
            );
            frameTop.position.y = frameHeight / 2;
            frameGroup.add(frameTop);

            const frameBottom = new THREE.Mesh(
                new THREE.BoxGeometry(frameWidth + 0.2, frameThickness, frameThickness),
                frameMaterial
            );
            frameBottom.position.y = -frameHeight / 2;
            frameGroup.add(frameBottom);

            const frameLeft = new THREE.Mesh(
                new THREE.BoxGeometry(frameThickness, frameHeight, frameThickness),
                frameMaterial
            );
            frameLeft.position.x = -frameWidth / 2;
            frameGroup.add(frameLeft);

            const frameRight = new THREE.Mesh(
                new THREE.BoxGeometry(frameThickness, frameHeight, frameThickness),
                frameMaterial
            );
            frameRight.position.x = frameWidth / 2;
            frameGroup.add(frameRight);

            // 작품 캔버스
            const artworkMaterial = new THREE.MeshStandardMaterial({
                color: art.color,
                roughness: 0.6,
                metalness: 0
            });

            const artwork = new THREE.Mesh(
                new THREE.PlaneGeometry(frameWidth - 0.1, frameHeight - 0.1),
                artworkMaterial
            );
            artwork.castShadow = true;
            frameGroup.add(artwork);

            // 위치 및 회전
            frameGroup.position.set(art.x, 2, art.z);
            if (art.rotation) {
                frameGroup.rotation.y = art.rotation;
            }

            frameGroup.castShadow = true;
            scene.add(frameGroup);

            // 작품별 스포트라이트
            const spotlight = new THREE.SpotLight(0xffffff, 1.2);
            spotlight.position.set(art.x, 3.5, art.z - 0.5);
            spotlight.target = artwork;
            spotlight.angle = Math.PI / 8;
            spotlight.penumbra = 0.5;
            spotlight.castShadow = true;
            scene.add(spotlight);
        }

        // 컨트롤 설정
        function setupControls() {
            // 키보드
            document.addEventListener('keydown', (e) => {
                switch(e.code) {
                    case 'KeyW': moveForward = true; break;
                    case 'KeyS': moveBackward = true; break;
                    case 'KeyA': moveLeft = true; break;
                    case 'KeyD': moveRight = true; break;
                    case 'Space': moveUp = true; e.preventDefault(); break;
                    case 'KeyC': moveDown = true; break;
                    case 'ShiftLeft': sprint = true; break;
                }
            });

            document.addEventListener('keyup', (e) => {
                switch(e.code) {
                    case 'KeyW': moveForward = false; break;
                    case 'KeyS': moveBackward = false; break;
                    case 'KeyA': moveLeft = false; break;
                    case 'KeyD': moveRight = false; break;
                    case 'Space': moveUp = false; break;
                    case 'KeyC': moveDown = false; break;
                    case 'ShiftLeft': sprint = false; break;
                }
            });

            // 마우스 컨트롤
            renderer.domElement.addEventListener('click', () => {
                renderer.domElement.requestPointerLock();
            });

            document.addEventListener('pointerlockchange', () => {
                isPointerLocked = document.pointerLockElement === renderer.domElement;
                document.getElementById('controls').classList.toggle('hidden', isPointerLocked);
            });

            document.addEventListener('mousemove', (e) => {
                if (!isPointerLocked) return;

                const movementX = e.movementX || 0;
                const movementY = e.movementY || 0;

                rotation.y -= movementX * 0.002;
                rotation.x -= movementY * 0.002;
                rotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, rotation.x));

                camera.rotation.copy(rotation);
            });

            // 윈도우 리사이즈
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        // 애니메이션 루프
        function animate() {
            requestAnimationFrame(animate);

            // 이동 처리
            const moveSpeed = sprint ? 0.15 : 0.08;

            direction.z = Number(moveForward) - Number(moveBackward);
            direction.x = Number(moveRight) - Number(moveLeft);
            direction.y = Number(moveUp) - Number(moveDown);
            direction.normalize();

            if (moveForward || moveBackward) {
                velocity.z -= direction.z * moveSpeed;
            }
            if (moveLeft || moveRight) {
                velocity.x -= direction.x * moveSpeed;
            }
            if (moveUp || moveDown) {
                camera.position.y += direction.y * moveSpeed;
            }

            camera.translateX(velocity.x);
            camera.translateZ(velocity.z);

            velocity.multiplyScalar(0.9); // 감속

            // 경계 체크
            camera.position.x = Math.max(-14, Math.min(14, camera.position.x));
            camera.position.z = Math.max(-14, Math.min(14, camera.position.z));
            camera.position.y = Math.max(0.5, Math.min(4.5, camera.position.y));

            renderer.render(scene, camera);
        }

        // 시작!
        init();
    </script>
</body>
</html>
