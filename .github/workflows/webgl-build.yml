name: WebGL 빌드 및 배포

on:
  push:
    branches:
      - claude/voxels-korean-char-011CUumPbfUUn7d8tLwuXHig
      - main
      - master
  workflow_dispatch: # 수동 실행 가능

jobs:
  buildWebGL:
    name: Unity WebGL 빌드
    runs-on: ubuntu-latest

    steps:
      # 1. 코드 체크아웃
      - name: 코드 가져오기
        uses: actions/checkout@v4
        with:
          lfs: true # Git LFS 지원

      # 2. Git LFS 캐시
      - name: Git LFS 캐시
        uses: actions/cache@v3
        with:
          path: .git/lfs
          key: ${{ runner.os }}-lfs-${{ hashFiles('.gitattributes') }}

      # 3. Unity 라이브러리 캐시
      - name: Unity 라이브러리 캐시
        uses: actions/cache@v3
        with:
          path: 4-11/Library
          key: Library-4-11-WebGL-${{ hashFiles('4-11/Assets/**', '4-11/Packages/**', '4-11/ProjectSettings/**') }}
          restore-keys: |
            Library-4-11-WebGL-
            Library-4-11-

      # 4. Unity WebGL 빌드
      - name: Unity WebGL 빌드
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: 4-11
          targetPlatform: WebGL
          buildName: LifeUnityMetaverse
          buildsPath: build
          # Unity 2021.3.9f1 사용
          unityVersion: 2021.3.9f1
          # 빌드 설정
          buildMethod: UnityBuilderAction.BuildScript.Build

      # 5. 빌드 결과물 압축 (선택)
      - name: 빌드 결과물 압축
        run: |
          cd build/WebGL/LifeUnityMetaverse
          tar -czf ../LifeUnityMetaverse-WebGL.tar.gz .

      # 6. GitHub Pages 배포
      - name: GitHub Pages 배포
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/WebGL/LifeUnityMetaverse
          publish_branch: gh-pages
          force_orphan: true # 이전 히스토리 삭제 (용량 절약)

      # 7. 아티팩트 업로드 (다운로드 가능)
      - name: 빌드 결과물 업로드
        uses: actions/upload-artifact@v3
        with:
          name: WebGL-Build
          path: build/WebGL/LifeUnityMetaverse
          retention-days: 14 # 14일간 보관

  # 빌드 완료 알림 (선택)
  notify:
    name: 빌드 완료 알림
    needs: buildWebGL
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: 빌드 상태 확인
        run: |
          if [ "${{ needs.buildWebGL.result }}" == "success" ]; then
            echo "✅ WebGL 빌드 성공!"
            echo "🌐 URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          else
            echo "❌ WebGL 빌드 실패"
            exit 1
          fi
